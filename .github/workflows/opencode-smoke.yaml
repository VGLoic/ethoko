name: OpenCode OpenAI smoke test

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Same-repository isolation-fixture PR to inspect and receive two test comments
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  smoke:
    name: Smoke / ${{ matrix.model }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        model: [gpt-6-astra, gpt-6.1-sol]
    env:
      SMOKE_MODEL: openai/${{ matrix.model }}#medium
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: contract
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: contract/.nvmrc
      - name: Validate and resolve PR target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr }}
        run: |
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo 'Expected a positive PR number'; exit 1; }
          gh pr view "$PR_NUMBER" --json headRepository,isCrossRepository \
            --jq '.isCrossRepository == false' | grep -qx true
          head_sha=$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'Expected a PR head SHA'; exit 1; }
          echo "sha=$head_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.target.outputs.sha }}
          path: inspected-pr
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Record checkout identity
        run: |
          echo "Default-branch contract: $(git -C contract rev-parse HEAD)"
          echo "Inspected PR: $(git -C inspected-pr rev-parse HEAD)"
          git -C inspected-pr show HEAD:.github/opencode-smoke/inspection.txt
      - name: Install OpenCode V2
        run: |
          npm install --global @opencode/cli
          opencode --version
      - name: Import OpenAI credential
        env:
          OPENAI_AUTH: ${{ secrets.OPENCODE_OPENAI_AUTH }}
        run: |
          test -n "$OPENAI_AUTH" || { echo 'Missing OPENCODE_OPENAI_AUTH secret'; exit 1; }
          umask 077
          credential_file="$RUNNER_TEMP/openai-auth.json"
          trap 'rm -f "$credential_file"' EXIT
          printf '%s' "$OPENAI_AUTH" > "$credential_file"
          opencode auth import --standalone "$credential_file"
      - name: Delegate and publish smoke comment
        working-directory: contract/.github/opencode-smoke
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr }}
          PR_CHECKOUT: ${{ github.workspace }}/inspected-pr
          PR_HEAD: ${{ steps.target.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          opencode run --standalone --auto --format json \
            --agent smoke-coordinator --model "$SMOKE_MODEL" \
            "@openai-smoke Run only this smoke skill. Repository: $GH_REPO. PR: $PR_NUMBER. Inspected checkout: $PR_CHECKOUT. Expected PR head: $PR_HEAD. Exact coordinator and child model: $SMOKE_MODEL. Run: $RUN_URL."
